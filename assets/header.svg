<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#2a0000"/>
      <stop offset="1" stop-color="#050000"/>
    </radialGradient>
    <linearGradient id="blood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff1a1a"/>
      <stop offset="1" stop-color="#8a0000"/>
    </linearGradient>
    <linearGradient id="drip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b30000"/>
      <stop offset="1" stop-color="#cc0000"/>
    </linearGradient>
    <filter id="rough" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
    </filter>
  </defs>

  <rect width="1000" height="320" fill="url(#bg)"/>

  <!-- bercak darah di latar -->
  <g fill="#8a0303" opacity="0.55">
    <circle cx="70" cy="60" r="26"/><circle cx="105" cy="85" r="9"/><circle cx="48" cy="102" r="6"/>
    <circle cx="930" cy="48" r="22"/><circle cx="900" cy="78" r="8"/><circle cx="960" cy="92" r="5"/>
    <circle cx="90" cy="270" r="18"/><circle cx="125" cy="288" r="7"/>
    <circle cx="915" cy="265" r="24"/><circle cx="880" cy="292" r="9"/><circle cx="950" cy="296" r="5"/>
    <circle cx="500" cy="300" r="14"/><circle cx="540" cy="308" r="6"/>
  </g>

  <!-- judul berkedip -->
  <g filter="url(#rough)">
    <animate attributeName="opacity" values="1;1;1;0.25;1;0.6;1;1;1" dur="5s" repeatCount="indefinite"/>
    <text x="500" y="150" text-anchor="middle" textLength="760" lengthAdjust="spacingAndGlyphs"
          font-family="Impact, 'Arial Black', 'Arial Narrow Bold', sans-serif" font-size="58" font-weight="900"
          fill="url(#blood)" stroke="#2a0000" stroke-width="2">MARTIN HATTARAJASA</text>
  </g>

  <!-- tetesan dari huruf -->
  <rect x="150" y="148" width="8" height="15" rx="4" fill="url(#drip)"><animate attributeName="height" values="15;70;15" dur="6s" repeatCount="indefinite"/></rect>
  <circle cx="154" r="7" fill="#cc0000"><animate attributeName="cy" values="160.6;215.6;160.6" dur="6s" repeatCount="indefinite"/></circle>

  <rect x="225" y="148" width="6" height="12" rx="3" fill="url(#drip)"><animate attributeName="height" values="12;45;12" dur="4.5s" begin="1s" repeatCount="indefinite"/></rect>
  <circle cx="228" r="5" fill="#cc0000"><animate attributeName="cy" values="158.2;191.2;158.2" dur="4.5s" begin="1s" repeatCount="indefinite"/></circle>

  <rect x="300" y="148" width="10" height="16" rx="5" fill="url(#drip)"><animate attributeName="height" values="16;95;16" dur="7s" begin="0.5s" repeatCount="indefinite"/></rect>
  <circle cx="305" r="9" fill="#cc0000"><animate attributeName="cy" values="161;240;161" dur="7s" begin="0.5s" repeatCount="indefinite"/></circle>

  <rect x="380" y="148" width="7" height="14" rx="3.5" fill="url(#drip)"><animate attributeName="height" values="14;55;14" dur="5s" begin="2s" repeatCount="indefinite"/></rect>
  <circle cx="383.5" r="6.5" fill="#cc0000"><animate attributeName="cy" values="159.9;200.9;159.9" dur="5s" begin="2s" repeatCount="indefinite"/></circle>

  <rect x="470" y="148" width="11" height="18" rx="5.5" fill="url(#drip)"><animate attributeName="height" values="18;110;18" dur="7.5s" begin="1.5s" repeatCount="indefinite"/></rect>
  <circle cx="475.5" r="10" fill="#cc0000"><animate attributeName="cy" values="162.7;254.7;162.7" dur="7.5s" begin="1.5s" repeatCount="indefinite"/></circle>

  <rect x="560" y="148" width="7" height="14" rx="3.5" fill="url(#drip)"><animate attributeName="height" values="14;60;14" dur="5.2s" begin="0.3s" repeatCount="indefinite"/></rect>
  <circle cx="563.5" r="6.5" fill="#cc0000"><animate attributeName="cy" values="159.9;205.9;159.9" dur="5.2s" begin="0.3s" repeatCount="indefinite"/></circle>

  <rect x="640" y="148" width="9" height="16" rx="4.5" fill="url(#drip)"><animate attributeName="height" values="16;85;16" dur="6.5s" begin="2.5s" repeatCount="indefinite"/></rect>
  <circle cx="644.5" r="8" fill="#cc0000"><animate attributeName="cy" values="161.3;230.3;161.3" dur="6.5s" begin="2.5s" repeatCount="indefinite"/></circle>

  <rect x="725" y="148" width="6" height="12" rx="3" fill="url(#drip)"><animate attributeName="height" values="12;48;12" dur="4.2s" begin="1.2s" repeatCount="indefinite"/></rect>
  <circle cx="728" r="5.5" fill="#cc0000"><animate attributeName="cy" values="158.2;194.2;158.2" dur="4.2s" begin="1.2s" repeatCount="indefinite"/></circle>

  <rect x="800" y="148" width="10" height="16" rx="5" fill="url(#drip)"><animate attributeName="height" values="16;92;16" dur="7s" begin="0.8s" repeatCount="indefinite"/></rect>
  <circle cx="805" r="9" fill="#cc0000"><animate attributeName="cy" values="161;237;161" dur="7s" begin="0.8s" repeatCount="indefinite"/></circle>

  <rect x="855" y="148" width="7" height="14" rx="3.5" fill="url(#drip)"><animate attributeName="height" values="14;50;14" dur="5s" begin="2.2s" repeatCount="indefinite"/></rect>
  <circle cx="858.5" r="6.5" fill="#cc0000"><animate attributeName="cy" values="159.9;195.9;159.9" dur="5s" begin="2.2s" repeatCount="indefinite"/></circle>

  <!-- subjudul -->
  <text x="500" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22"
        letter-spacing="8" fill="#d9d9d9">
    <animate attributeName="opacity" values="1;1;0.4;1;1" dur="3.5s" repeatCount="indefinite"/>
    ☠ FULLSTACK DEVELOPER ☠
  </text>
</svg>
